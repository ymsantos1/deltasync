name: deltasync
description: Offline-first synchronization primitives for Dart.
version: 1.0.1
repository: https://github.com/ymsantos1/deltasync
issue_tracker: https://github.com/ymsantos1/deltasync/issues
workspace:
  - packages/deltasync_core
  - packages/deltasync_sync
  - packages/deltasync_storage
  - packages/deltasync_storage_sqflite
  - packages/deltasync_storage_testing
  - packages/deltasync_transport

environment:
  sdk: ^3.13.0

# Add regular dependencies here.
dependencies:
  deltasync_core: ^1.0.1
  deltasync_storage: ^1.0.1
  deltasync_sync: ^1.0.1
  deltasync_transport: ^1.0.1

dev_dependencies:
  lints: ^6.0.0
  deltasync_storage_sqflite: ^1.0.1
  sqflite_common_ffi: ^2.3.6
  test: ^1.25.6
